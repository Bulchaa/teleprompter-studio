<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8a22f'/%3E%3Crect x='12' y='16' width='40' height='32' rx='6' fill='%23211b15'/%3E%3Cpath d='M20 26h24M20 32h17' stroke='%23fffdf9' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Teleprompter Remote</title>
<script>
(function(){try{var t=localStorage.getItem('tp-theme');var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0d0c0a':'#f3f0e9');}catch(e){document.documentElement.dataset.theme='dark';}})();
</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/remote.css">
</head>
<body class="remote-page">
<main class="remote-shell">
  <header class="remote-header">
    <div class="remote-brand">
      <div class="remote-mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      </div>
      <div class="remote-brand-text">
        <h1 class="remote-title">Teleprompter <span>Remote</span></h1>
        <p class="remote-sub">Control your reading from any tab</p>
      </div>
    </div>
    <button id="remoteTheme" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <section class="remote-panel" aria-label="Remote controls">
    <div class="remote-status-row">
      <div class="remote-status">
        <span id="statusDot" class="live-dot"></span>
        <div>
          <div id="st" class="remote-status-text" aria-live="polite">Waiting for reader…</div>
          <div class="remote-status-sub">Same browser · same device</div>
        </div>
      </div>
      <span id="remoteBadge" class="remote-badge">Ready</span>
    </div>

    <div class="remote-progress-row">
      <div class="remote-track" aria-hidden="true"><span id="remoteProgressFill"></span></div>
      <span id="remotePct">0%</span>
    </div>

    <div id="btns" class="remote-grid"></div>
  </section>

  <p class="remote-hint">Open Teleprompter Studio, enable <strong>Remote control</strong> in the sidebar, then start reading. Keep both tabs open.</p>
</main>

<script>
const $=id=>document.getElementById(id);
const root=document.documentElement;
const meta=document.querySelector('meta[name="theme-color"]');
function setTheme(theme,persist){
  theme=theme==='dark'?'dark':'light';
  root.dataset.theme=theme;
  if(persist){try{localStorage.setItem('tp-theme',theme)}catch(e){}}
  meta.setAttribute('content',theme==='dark'?'#0d0c0a':'#f3f0e9');
  const next=theme==='dark'?'light':'dark';
  $('remoteTheme').setAttribute('aria-label','Switch to '+next+' mode');
  $('remoteTheme').title='Switch to '+next+' mode';
  $('remoteTheme').setAttribute('aria-pressed',String(theme==='dark'));
}
setTheme(root.dataset.theme||'light',false);
$('remoteTheme').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark',true);

const ICONS={
  play:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  pause:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>',
  restart:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5"/><path d="M4.6 10a8 8 0 1 1-.4 5"/></svg>',
  back:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6 4 11l5 5"/><path d="M4 11h9a6 6 0 0 1 0 12h-1"/></svg>',
  fwd:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6 5 5-5 5"/><path d="M20 11h-9a6 6 0 0 0 0 12h1"/></svg>',
  slower:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>',
  faster:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>',
  smaller:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7v10M9 12H3M14 12h7M17.5 8.5v7"/></svg>',
  bigger:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7v10M9 12H3M14 12h7M17.5 8.5v7M21 12h-7"/></svg>',
  mirror:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M9 6 4 9v6l5 3zM15 6l5 3v6l-5 3z"/></svg>'
};
const COMMANDS=[
  ['toggle','Play / Pause','play',true],
  ['restart','Restart','restart'],
  ['back','Back 10s','back'],
  ['fwd','Forward 10s','fwd'],
  ['slower','Slower','slower'],
  ['faster','Faster','faster'],
  ['smaller','Text −','smaller'],
  ['bigger','Text +','bigger'],
  ['mirror','Mirror','mirror']
];
const ch=new BroadcastChannel('tp-remote');
let playBtn;
COMMANDS.forEach(([cmd,label,icon,wide])=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='remote-btn'+(wide?' remote-btn-wide remote-btn-primary':'');
  b.innerHTML=`<span class="remote-btn-icon">${ICONS[icon]}</span><span class="remote-btn-label">${label}</span>`;
  b.onclick=()=>{
    ch.postMessage({cmd});
    b.classList.add('is-pressed');
    setTimeout(()=>b.classList.remove('is-pressed'),170);
  };
  if(cmd==='toggle')playBtn=b;
  $('btns').append(b);
});

function setPlaying(playing){
  if(!playBtn)return;
  playBtn.querySelector('.remote-btn-label').textContent=playing?'Pause':'Play / Pause';
  playBtn.querySelector('.remote-btn-icon').innerHTML=playing?ICONS.pause:ICONS.play;
}

ch.onmessage=e=>{
  if(!e.data.state)return;
  const s=e.data.state;
  $('st').textContent=(s.playing?'Playing':'Paused')+' · '+s.speed+' wpm';
  $('remotePct').textContent=s.progress+'%';
  $('remoteProgressFill').style.width=s.progress+'%';
  $('statusDot').classList.add('is-live');
  $('remoteBadge').textContent=s.playing?'Live':'Paused';
  $('remoteBadge').classList.toggle('is-live',s.playing);
  setPlaying(s.playing);
};
ch.postMessage({cmd:'hello'});
</script>
</body>
</html>
