<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f0e9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8a22f'/%3E%3Crect x='12' y='16' width='40' height='32' rx='6' fill='%23211b15'/%3E%3Cpath d='M20 26h24M20 32h17' stroke='%23fffdf9' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Teleprompter Studio</title>
<script>
(function(){try{var t=localStorage.getItem('tp-theme');var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0d0c0a':'#f3f0e9');}catch(e){document.documentElement.dataset.theme='dark';}})();
</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app-body">
<div class="app-bg" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open script library" aria-controls="sidebar" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3.2"/><path d="M7 9h10M7 12h7"/><path d="M15.5 14.2v3.6l3-1.8z" fill="currentColor" stroke="none"/></svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-title">Teleprompter<span class="brand-studio"> <span class="accent">Studio</span></span></h1>
        <p class="brand-sub"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Saved locally in this browser</p>
      </div>
    </div>

    <div class="top-actions">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>

      <div id="headerActions" class="header-actions">
        <button id="btnNew" class="btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-text">New script</span>
        </button>
        <button id="btnImport" class="btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
          <span class="btn-text">Import</span>
        </button>
        <label class="select-wrap">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
          <select id="exportSel" aria-label="Export script">
            <option value="">Export…</option>
            <option value="txt">Plain text (.txt)</option>
            <option value="md">Markdown (.md)</option>
            <option value="html">Web page (.html)</option>
            <option value="docx">Word (.docx)</option>
            <option value="json">JSON (.json)</option>
            <option value="zip">Backup (.zip)</option>
          </select>
          <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </label>
      </div>

      <button id="btnPresent" class="btn btn-primary" type="button" aria-label="Start reading">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></svg>
        <span class="btn-text-long">Start reading</span>
        <span class="btn-text-short">Start</span>
      </button>

      <button id="actionsBtn" class="icon-btn actions-btn" type="button" aria-label="More actions" aria-controls="headerActions" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>

    <input id="fileIn" type="file" multiple hidden accept=".txt,.md,.markdown,.html,.htm,.docx,.pdf,.json">
  </header>

  <main class="workspace">
    <aside id="sidebar" class="sidebar" aria-label="Script library">
      <div class="sidebar-head">
        <div class="sidebar-title"><span>Library</span><span id="scriptCount" class="count-badge">0</span></div>
        <button id="sidebarClose" class="icon-btn sidebar-close" type="button" aria-label="Close script library">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <label class="search-field">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" placeholder="Search scripts…" autocomplete="off" aria-label="Search scripts">
      </label>

      <ul id="list" class="script-list"></ul>

      <div id="modules" class="modules">
        <div class="modules-head"><span>Advanced modules</span><span class="chip">Optional</span></div>
        <label class="switch-row">
          <span class="module-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg></span>
          <span class="module-label">Voice following</span>
          <input class="switch-input" type="checkbox" data-mod="voice">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <label class="switch-row">
          <span class="module-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-3v10l-5-3"/></svg></span>
          <span class="module-label">Recording</span>
          <input class="switch-input" type="checkbox" data-mod="recorder">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <label class="switch-row">
          <span class="module-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg></span>
          <span class="module-label">Remote control</span>
          <input class="switch-input" type="checkbox" data-mod="remote">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
        <label class="switch-row">
          <span class="module-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h18M3 6l3 3M21 6l-3 3"/></svg></span>
          <span class="module-label">Web remote</span>
          <input class="switch-input" type="checkbox" data-mod="webremote">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </div>
    </aside>

    <div id="backdrop" class="backdrop" aria-hidden="true"></div>

    <section class="editor-pane" aria-label="Script editor">
      <div class="editor-card">
        <div class="editor-head">
          <div class="editor-head-main">
            <div class="eyebrow">Script editor</div>
            <input id="title" class="title-input" placeholder="Untitled script" autocomplete="off" aria-label="Script title">
          </div>
          <span class="editor-badge"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Local only</span>
        </div>
        <textarea id="body" class="body-input" placeholder="Type, paste, or import your script. Blank lines start new paragraphs." spellcheck="true" aria-label="Script body"></textarea>
        <footer class="editor-footer">
          <div class="editor-stats"><span id="stats"></span><span class="sep">·</span><span id="saved"></span></div>
          <label class="wpm-field"><span>Words/min</span><input id="wpm" type="number" value="150" inputmode="numeric" aria-label="Words per minute"></label>
        </footer>
      </div>
      <div id="recList" class="rec-panel hidden"></div>
    </section>
  </main>
</div>

<div id="reader" class="reader hidden" role="dialog" aria-modal="true" aria-label="Teleprompter reader">
  <div class="reader-vignette" aria-hidden="true"></div>

  <div class="reader-top">
    <div class="reader-live"><span class="live-dot"></span> On air</div>
    <div id="readerDoc" class="reader-doc">Untitled script</div>
    <div class="reader-hint"><kbd>Space</kbd> play/pause <span class="dot">·</span> <kbd>Esc</kbd> exit</div>
  </div>

  <div id="viewport" class="reader-viewport"><div id="stage"></div></div>
  <div id="guide" class="reader-guide" aria-hidden="true"></div>

  <video id="cam" class="reader-cam hidden" muted playsinline></video>
  <div id="countdown" class="reader-countdown hidden"></div>

  <div id="bar" class="reader-bar">
    <div class="reader-main">
      <button id="rRestart" class="reader-icon-btn" type="button" title="Restart (R)" aria-label="Restart reading">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v5h5"/><path d="M4.6 10a8 8 0 1 1-.4 5"/></svg>
      </button>
      <button id="rPlay" class="reader-play" type="button" aria-label="Play (Space)">
        <svg class="icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <svg class="icon pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
        <span id="rPlayLabel">Play</span>
      </button>
      <div class="reader-progress-wrap">
        <div class="reader-track" aria-hidden="true"><div id="rProgressFill"></div></div>
        <span id="rProg" aria-live="polite">0%</span>
      </div>
      <label class="reader-speed">
        <span class="reader-control-label">Speed</span>
        <input id="rSpeed" type="range" min="10" max="400" value="80" aria-label="Reading speed">
        <output id="rSpeedVal" for="rSpeed">80</output>
      </label>
      <div class="reader-actions">
        <button id="rSettingsBtn" class="reader-icon-btn" type="button" title="Reader settings" aria-label="Reader settings" aria-expanded="false" aria-controls="readerExtras">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <button id="rClose" class="reader-exit" type="button" title="Exit reader (Esc)" aria-label="Exit reader">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          <span>Exit</span>
        </button>
      </div>
    </div>

    <div id="readerExtras" class="reader-extras">
      <label class="reader-control">Text size <input id="rSize" type="range" min="24" max="160" value="64" aria-label="Text size"><output id="rSizeVal" for="rSize">64</output></label>
      <label class="reader-control">Width <input id="rWidth" type="range" min="30" max="100" value="80" aria-label="Text width"><output id="rWidthVal" for="rWidth">80%</output></label>
      <label class="reader-toggle"><input id="rMirror" type="checkbox"> Mirror text</label>
      <label class="reader-control reader-count">Countdown <input id="rCount" type="number" min="0" max="10" value="3" inputmode="numeric" aria-label="Countdown seconds">s</label>
      <span id="modBar" class="reader-modules"></span>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
